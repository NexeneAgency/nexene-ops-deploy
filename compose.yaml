name: nexene-ops
services:
  ops:
    build:
      context: https://github.com/NexeneAgency/nexene-ops-app.git#main
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: ${OPS_CPUS:-1.0}
    mem_limit: ${OPS_MEMORY:-512m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_URL: ${APP_URL:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      NODE_ENV: production
      DATA_DIR: /app/data
      BACKUP_DIR: /app/backups
      DEV_MAIL_LOG: "false"
      SEED_DEMO: "false"
    volumes:
      - ops_data:/app/data
      - ops_backups:/app/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
volumes:
  ops_data:
    name: nexene_ops_data
  ops_backups:
    name: nexene_ops_backups
